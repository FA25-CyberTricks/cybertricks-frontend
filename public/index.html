<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CyberTrick – Your Ultimate Gaming Hub</title>

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Orbitron:wght@700;800;900&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        var KEY = "boot:lock";
        var MS = 1500;
        var now = Date.now();
        var until = Number(localStorage.getItem(KEY) || 0);
        if (!until || until <= now) {
          localStorage.setItem(KEY, String(now + MS));
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
